<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110">
  <!-- Hexagonal cube (flat-top, isometric view) -->
  <polygon points="50,22 80,39 80,73 50,90 20,73 20,39"
           fill="none" stroke="#7dc13a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Inner cube edges — top vertex to center -->
  <line x1="50" y1="22" x2="50" y2="56" stroke="#7dc13a" stroke-width="4" stroke-linecap="round"/>
  <!-- Right top vertex to center -->
  <line x1="80" y1="39" x2="50" y2="56" stroke="#7dc13a" stroke-width="4" stroke-linecap="round"/>
  <!-- Left top vertex to center -->
  <line x1="20" y1="39" x2="50" y2="56" stroke="#7dc13a" stroke-width="4" stroke-linecap="round"/>
  <!-- Center to bottom vertex -->
  <line x1="50" y1="56" x2="50" y2="90" stroke="#7dc13a" stroke-width="4" stroke-linecap="round"/>
  <!-- Center to bottom-right vertex -->
  <line x1="50" y1="56" x2="80" y2="73" stroke="#7dc13a" stroke-width="4" stroke-linecap="round"/>
  <!-- Center to bottom-left vertex -->
  <line x1="50" y1="56" x2="20" y2="73" stroke="#7dc13a" stroke-width="4" stroke-linecap="round"/>

  <!-- Leaf — single teardrop leaf at top-left, angled up-left -->
  <path d="M 34,26 C 28,10 14,8 16,20 C 18,30 30,30 34,26 Z"
        fill="#7dc13a"/>
  <!-- Leaf stem / midrib -->
  <line x1="34" y1="26" x2="22" y2="14" stroke="#5a9e28" stroke-width="1.5" stroke-linecap="round"/>
</svg>
